server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cho static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip tối ưu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
}
