name: Build and Deploy Backend Docker

on:
  push:
    branches: [ develop ]
    paths:
      - 'bucha-backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  ACR_NAME: chinesemasteracr
  IMAGE_NAME: chinese-master-backend
  BACKEND_PATH: bucha-backend
  WEBAPP_NAME: chinese-master-be
  RESOURCE_GROUP: ChineseMaster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./${{ env.BACKEND_PATH }}
        file: ./${{ env.BACKEND_PATH }}/Dockerfile
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max
    
    - name: Trigger Azure Web App deployment
      run: |
        echo "Docker image pushed successfully"
        echo "Image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
        echo "You can manually restart the web app or enable continuous deployment"