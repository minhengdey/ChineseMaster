name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'react-learning-app/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # ✅ THÊM BƯỚC NÀY - Set Node.js 20
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-learning-app/package-lock.json

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_DUNE_077A49C00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "react-learning-app"
          api_location: ""
          output_location: "dist"
          skip_app_build: false  # ✅ Đảm bảo build được chạy
        env:
          VITE_API_URL: https://chinese-master-be-f5emhxc7c5dwd7d2.southeastasia-01.azurewebsites.net