<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciation Practice - Bucha</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🇨🇳 Bucha</h1>
            <div class="nav-links">
                <a href="lessons.html">Lessons</a>
                <a href="flashcards.html">Flashcards</a>
                <a href="pronunciation.html" class="active">Pronunciation</a>
                <a href="quiz.html">Quiz</a>
                <a href="profile.html">Profile</a>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h2>🎤 Pronunciation Practice</h2>
            <p>Upload your audio recording to get pronunciation feedback</p>
        </header>

        <main>
            <div class="pronunciation-section">
                <form id="pronunciation-form" class="upload-form">
                    <div class="form-group">
                        <label for="lesson-select">Lesson (Optional)</label>
                        <select id="lesson-select">
                            <option value="">Select a lesson</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="audio-file">Audio Recording</label>
                        <input type="file" id="audio-file" accept="audio/*" required>
                        <small>Supported formats: MP3, WAV, M4A</small>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span id="upload-text">Get Pronunciation Score</span>
                        <span id="upload-loading" class="loading-spinner" style="display: none;">Analyzing...</span>
                    </button>
                </form>

                <div id="pronunciation-result" class="pronunciation-result" style="display: none;">
                    <div class="score-section">
                        <div class="score-circle">
                            <span id="score-value">85</span>
                            <small>/ 100</small>
                        </div>
                        <div class="score-details">
                            <h3>Pronunciation Score</h3>
                            <p id="feedback-text">Good job! Work on your tones.</p>
                        </div>
                    </div>

                    <div class="syllables-section">
                        <h4>Syllable Analysis</h4>
                        <div id="syllables-list" class="syllables-list">
                            <!-- Syllables will be populated here -->
                        </div>
                    </div>

                    <div class="audio-playback">
                        <h4>Your Recording</h4>
                        <audio id="result-audio" controls style="width: 100%;"></audio>
                    </div>
                </div>
            </div>
        </main>

        <div id="error-message" class="error-message"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/pronunciation.js"></script>
</body>
</html>
