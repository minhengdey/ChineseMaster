<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards - Bucha</title>
    <link rel="stylesheet" href="style/main.css">

</head>

<body>
    <nav class="bg-base-100 border-b">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="font-bold">Bucha</a>
                </div>
                <div class="flex items-center gap-3">
                    <a href="lessons.html" class="btn btn-ghost btn-sm">Lessons</a>
                    <a href="flashcards.html" class="btn btn-ghost btn-sm">Flashcards</a>
                    <a href="pronunciation.html" class="btn btn-ghost btn-sm">Pronunciation</a>
                    <a href="quiz.html" class="btn btn-ghost btn-sm">Quiz</a>
                    <a href="profile.html" class="btn btn-ghost btn-sm">Profile</a>
                    <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen bg-base-200">
        <div class="container mx-auto px-4 py-8">
            <!-- Header Stats -->
            <div class="stats shadow-xl bg-base-100 mb-8 w-full">
                <div class="stat">
                    <div class="stat-figure text-secondary">
                        <div class="text-3xl">🧠</div>
                    </div>
                    <div class="stat-title">Cards to Review</div>
                    <div class="stat-value text-primary" id="card-counter">0 / 0</div>
                    <div class="stat-desc">Keep up the great work!</div>
                </div>
                <div class="stat">
                    <div class="stat-figure text-secondary">
                        <div class="text-3xl">⚡</div>
                    </div>
                    <div class="stat-title">Study Streak</div>
                    <div class="stat-value text-secondary">7</div>
                    <div class="stat-desc">Days in a row</div>
                </div>
                <div class="stat">
                    <div class="stat-figure text-secondary">
                        <div class="text-3xl">🎯</div>
                    </div>
                    <div class="stat-title">Accuracy</div>
                    <div class="stat-value text-accent">92%</div>
                    <div class="stat-desc">Last 30 cards</div>
                </div>
            </div>

            <!-- Flashcard Section -->
            <div id="flashcard-container" class="flex justify-center">
                <div class="card w-96 h-80 bg-base-100 shadow-2xl perspective-1000">
                    <div id="flashcard"
                        class="relative w-full h-full transition-transform duration-700 transform-style-preserve-3d cursor-pointer">
                        <!-- Front of card -->
                        <div class="flashcard-front absolute inset-0 w-full h-full backface-hidden">
                            <div class="card-body flex flex-col items-center justify-center text-center h-full">
                                <div class="text-6xl font-bold text-primary mb-6" id="card-hanzi">你</div>
                                <button class="btn btn-outline btn-primary" id="flip-btn">
                                    <span class="mr-2">👁️</span>
                                    Show Answer
                                </button>
                            </div>
                        </div>

                        <!-- Back of card -->
                        <div class="flashcard-back absolute inset-0 w-full h-full backface-hidden rotate-y-180">
                            <div class="card-body flex flex-col items-center justify-center text-center h-full">
                                <div class="text-3xl font-semibold text-secondary mb-2" id="card-pinyin">nǐ</div>
                                <div class="text-xl text-base-content/80 mb-6" id="card-meaning">you</div>
                                <div class="flex gap-2 review-buttons">
                                    <button class="btn btn-error btn-sm" data-result="again">
                                        <span class="mr-1">😞</span>
                                        Again
                                    </button>
                                    <button class="btn btn-warning btn-sm" data-result="good">
                                        <span class="mr-1">😐</span>
                                        Good
                                    </button>
                                    <button class="btn btn-success btn-sm" data-result="easy">
                                        <span class="mr-1">😊</span>
                                        Easy
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="mt-8 max-w-md mx-auto">
                <div class="flex justify-between text-sm text-base-content/60 mb-2">
                    <span>Progress</span>
                    <span id="progress-text">0%</span>
                </div>
                <progress id="study-progress" class="progress progress-primary w-full" value="0" max="100"></progress>
            </div>

            <!-- Completion State -->
            <div id="no-cards" class="text-center py-16" style="display: none;">
                <div class="text-8xl mb-4">🎉</div>
                <h3 class="text-3xl font-bold mb-4">All caught up!</h3>
                <p class="text-lg text-base-content/70 mb-8">No cards to review right now. Great job on your studies!
                </p>
                <div class="flex gap-4 justify-center">
                    <a href="lessons.html" class="btn btn-primary">
                        <span class="mr-2">📚</span>
                        Browse Lessons
                    </a>
                    <a href="profile.html" class="btn btn-outline">
                        <span class="mr-2">📊</span>
                        View Stats
                    </a>
                </div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="error-message" class="toast toast-top toast-end" style="display: none;">
            <div class="alert alert-error">
                <span id="error-text"></span>
            </div>
        </div>
    </div>

    <style>
        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-preserve-3d {
            transform-style: preserve-3d;
        }

        .backface-hidden {
            backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }
    </style>

    <script type="module">
        import { requireAuth, getFlashcards, reviewFlashcard, showError, initGlobal } from './js/api.js'
        initGlobal()

        // Flashcards UI logic (inlined)
        document.addEventListener("DOMContentLoaded", () => {
            if (!requireAuth()) return

            const flashcardContainer = document.getElementById("flashcard-container")
            const flashcard = document.getElementById("flashcard")
            const flipBtn = document.getElementById("flip-btn")
            const cardCounter = document.getElementById("card-counter")
            const noCards = document.getElementById("no-cards")
            const reviewButtons = document.querySelectorAll(".review-buttons .btn")

            let currentCards = []
            let currentCardIndex = 0
            let isFlipped = false

            // Load flashcards
            async function loadFlashcards() {
                try {
                    currentCards = await getFlashcards()
                    if (!currentCards || currentCards.length === 0) {
                        flashcardContainer.style.display = "none"
                        noCards.style.display = "block"
                    } else {
                        flashcardContainer.style.display = "block"
                        noCards.style.display = "none"
                        currentCardIndex = 0
                        showCurrentCard()
                    }
                } catch (error) {
                    showError(error.message)
                }
            }

            // Show current card
            function showCurrentCard() {
                if (!currentCards || currentCards.length === 0) return

                const card = currentCards[currentCardIndex]

                // Update card content
                document.getElementById("card-hanzi").textContent = card.hanzi
                document.getElementById("card-pinyin").textContent = card.pinyin
                document.getElementById("card-meaning").textContent = card.meaning

                // Update counter and progress
                const total = currentCards.length
                const completed = total - currentCards.length + currentCardIndex
                const progressPercent = Math.round((completed / total) * 100)

                cardCounter.textContent = `${currentCardIndex + 1} / ${total}`
                document.getElementById("progress-text").textContent = `${progressPercent}%`
                document.getElementById("study-progress").value = progressPercent

                // Reset flip state
                isFlipped = false
                flashcard.classList.remove("flipped")
                flipBtn.textContent = "Show Answer"
            }

            // Flip card
            flipBtn.addEventListener("click", () => {
                isFlipped = !isFlipped
                flashcard.classList.toggle("flipped")
                flipBtn.innerHTML = isFlipped ?
                    '<span class="mr-2">🔄</span>Show Question' :
                    '<span class="mr-2">👁️</span>Show Answer'
            })

            function showError(message) {
                const errorElement = document.getElementById("error-message")
                const errorText = document.getElementById("error-text")
                errorText.textContent = message
                errorElement.style.display = "block"
                setTimeout(() => {
                    errorElement.style.display = "none"
                }, 5000)
            }

            // Review buttons
            reviewButtons.forEach((btn) => {
                btn.addEventListener("click", async function () {
                    if (!isFlipped) {
                        showError("Please flip the card to see the answer first")
                        return
                    }

                    const result = this.dataset.result
                    const currentCard = currentCards[currentCardIndex]

                    try {
                        await reviewFlashcard(currentCard.id, result)
                        // Move to next card or finish
                        currentCards.splice(currentCardIndex, 1)
                        if (currentCards.length === 0) {
                            flashcardContainer.style.display = "none"
                            noCards.style.display = "block"
                        } else {
                            if (currentCardIndex >= currentCards.length) {
                                currentCardIndex = 0
                            }
                            showCurrentCard()
                        }
                    } catch (error) {
                        showError(error.message)
                    }
                })
            })

            // Load flashcards on page load
            loadFlashcards()
        })
    </script>
</body>

</html>
