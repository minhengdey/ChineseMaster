<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucha - Learn Chinese</title>
    <link rel="stylesheet" href="style/main.css">

</head>

<body>
    <div class="min-h-screen bg-base-200 flex items-center justify-center p-6">
        <div class="card w-full max-w-lg shadow-xl bg-base-100">
            <div class="card-body gap-2">
                <div class="flex flex-col items-center gap-3">
                    <div>
                        <h1 class="text-2xl font-bold">Bucha</h1>
                        <p class="text-sm text-muted">Master Chinese with interactive lessons, flashcards and
                            pronunciation practice</p>
                    </div>
                </div>
                <div class="tabs tabs-lift">
                    <input type="radio" name="my_tabs_3" class="tab" aria-label="Login" />
                    <div class="tab-content bg-base-100 border-base-300 p-6">
                        <form id="login-form" class="mt-2 space-y-4 ">
                            <h2 class="text-xl font-semibold">Welcome back</h2>
                            <div>
                                <label class="label"><span class="label-text">Email</span></label>
                                <input class="input input-bordered w-full" type="email" id="login-email" required>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Password</span></label>
                                <input class="input input-bordered w-full" type="password" id="login-password" required
                                    autocomplete="current-password">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="btn btn-primary w-full">Login</button>
                            </div>
                        </form>
                    </div>

                    <input type="radio" name="my_tabs_3" class="tab" aria-label="Signup" checked="checked" />
                    <div class="tab-content bg-base-100 border-base-300 p-6">
                        <form id="register-form" class=" space-y-4 mt-2">
                            <h2 class="text-xl font-semibold">Create account</h2>
                            <div>
                                <label class="label"><span class="label-text">Name</span></label>
                                <input class="input input-bordered w-full" type="text" id="register-name" required>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Email</span></label>
                                <input class="input input-bordered w-full" type="email" id="register-email" required>
                            </div>
                            <div>
                                <label class="label"><span class="label-text">Password</span></label>
                                <input class="input input-bordered w-full" type="password" id="register-password"
                                    required autocomplete="new-password">
                            </div>
                            <div class="pt-2">
                                <button type="submit" class="btn btn-primary w-full">Register</button>
                            </div>
                        </form>
                    </div>


                </div>

                <div id="error-message" class="mt-4 text-sm text-error"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, registerUser, setAuthToken, showError, showSuccess, initGlobal } from './js/api.js'
        initGlobal()

        // Tab switching
        const tabButtons = document.querySelectorAll('[data-tab]')
        const loginForm = document.getElementById('login-form')
        const registerForm = document.getElementById('register-form')

        tabButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                tabButtons.forEach(b => b.classList.remove('tab-active'))
                btn.classList.add('tab-active')
                if (btn.getAttribute('data-tab') === 'login') {
                    loginForm.classList.remove('hidden')
                    registerForm.classList.add('hidden')
                } else {
                    registerForm.classList.remove('hidden')
                    loginForm.classList.add('hidden')
                }
            })
        })

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('login-email').value
            const password = document.getElementById('login-password').value
            try {
                const response = await loginUser(email, password)
                setAuthToken(response.accessToken)
                window.location.href = './lessons.html'
            } catch (err) {
                showError(err.message)
            }
        })

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault()
            const name = document.getElementById('register-name').value
            const email = document.getElementById('register-email').value
            const password = document.getElementById('register-password').value
            try {
                await registerUser(email, password, name)
                showSuccess('Registration successful! Please login.')
                // switch to login tab
                document.querySelector('[data-tab="login"]').click()
                registerForm.reset()
            } catch (err) {
                showError(err.message)
            }
        })
    </script>
</body>

</html>
