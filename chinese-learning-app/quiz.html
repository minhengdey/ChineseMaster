<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Bucha</title>
    <link rel="stylesheet" href="style/main.css">

</head>

<body>
    <nav class="bg-base-100 border-b">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="font-bold">Bucha</a>
                </div>
                <div class="flex items-center gap-3">
                    <a href="lessons.html" class="btn btn-ghost btn-sm">Lessons</a>
                    <a href="flashcards.html" class="btn btn-ghost btn-sm">Flashcards</a>
                    <a href="pronunciation.html" class="btn btn-ghost btn-sm">Pronunciation</a>
                    <a href="quiz.html" class="btn btn-ghost btn-sm">Quiz</a>
                    <a href="profile.html" class="btn btn-ghost btn-sm">Profile</a>
                    <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen bg-base-200">
        <div class="container mx-auto px-4 py-8">
            <!-- Hero Section -->
            <div class="hero bg-gradient-to-r from-success to-info text-success-content rounded-xl mb-8">
                <div class="hero-content text-center py-12">
                    <div class="max-w-md">
                        <h1 class="text-4xl font-bold mb-4">📝 Quiz Practice</h1>
                        <p class="text-lg opacity-90">Test your knowledge with interactive quizzes and track your
                            progress</p>
                    </div>
                </div>
            </div>

            <!-- Lesson Selection -->
            <div class="card bg-base-100 shadow-xl mb-8">
                <div class="card-body">
                    <h2 class="card-title text-2xl mb-6">
                        <span class="mr-2">🎯</span>
                        Choose Your Quiz
                    </h2>
                    <form id="quiz-form">
                        <div class="form-control mb-6">
                            <label class="label">
                                <span class="label-text font-medium">Select Lesson</span>
                            </label>
                            <select id="quiz-lesson-select" class="select select-bordered select-primary w-full"
                                required>
                                <option value="">Choose a lesson to quiz on</option>
                            </select>
                        </div>

                        <!-- Quiz Questions -->
                        <div id="quiz-questions" class="space-y-6" style="display: none;">
                            <div class="card bg-base-200 shadow">
                                <div class="card-body">
                                    <h3 class="card-title text-lg mb-4">
                                        <span class="badge badge-primary mr-2">1</span>
                                        What does "你好" mean?
                                    </h3>
                                    <div class="space-y-3">
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q1" value="A" class="radio radio-primary">
                                            <span>Hello</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q1" value="B" class="radio radio-primary">
                                            <span>Goodbye</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q1" value="C" class="radio radio-primary">
                                            <span>Thank you</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q1" value="D" class="radio radio-primary">
                                            <span>Sorry</span>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="card bg-base-200 shadow">
                                <div class="card-body">
                                    <h3 class="card-title text-lg mb-4">
                                        <span class="badge badge-primary mr-2">2</span>
                                        How do you say "thank you" in Chinese?
                                    </h3>
                                    <div class="space-y-3">
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q2" value="A" class="radio radio-primary">
                                            <span>你好</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q2" value="B" class="radio radio-primary">
                                            <span>再见</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q2" value="C" class="radio radio-primary">
                                            <span>谢谢</span>
                                        </label>
                                        <label
                                            class="flex items-center gap-3 cursor-pointer hover:bg-base-300 p-3 rounded-lg">
                                            <input type="radio" name="q2" value="D" class="radio radio-primary">
                                            <span>对不起</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-actions justify-center pt-6">
                            <button type="button" id="start-quiz-btn" class="btn btn-primary btn-wide">
                                <span class="mr-2">🚀</span>
                                Start Quiz
                            </button>
                            <button type="submit" id="submit-quiz-btn" class="btn btn-success btn-wide"
                                style="display: none;">
                                <span class="mr-2">✅</span>
                                Submit Quiz
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Quiz Results -->
            <div id="quiz-result" class="space-y-6" style="display: none;">
                <!-- Score Summary -->
                <div class="card bg-base-100 shadow-xl">
                    <div class="card-body text-center">
                        <h2 class="card-title text-3xl justify-center mb-6">
                            <span class="mr-2">🎉</span>
                            Quiz Complete!
                        </h2>
                        <div class="stats shadow">
                            <div class="stat">
                                <div class="stat-title">Your Score</div>
                                <div class="stat-value text-primary">
                                    <span id="quiz-score">0</span> / <span id="quiz-total">0</span>
                                </div>
                                <div class="stat-desc" id="score-percentage">0% Correct</div>
                            </div>
                        </div>
                        <div class="mt-6">
                            <button id="retake-quiz-btn" class="btn btn-primary">
                                <span class="mr-2">🔄</span>
                                Take Another Quiz
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Detailed Results -->
                <div class="card bg-base-100 shadow-xl">
                    <div class="card-body">
                        <h3 class="card-title text-2xl mb-6">
                            <span class="mr-2">📊</span>
                            Detailed Results
                        </h3>
                        <div id="corrections-list" class="space-y-4">
                            <!-- Corrections will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="error-message" class="toast toast-top toast-end" style="display: none;">
            <div class="alert alert-error">
                <span id="error-text"></span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Quiz UI logic (inlined)
        document.addEventListener("DOMContentLoaded", () => {
            const quizForm = document.getElementById("quiz-form")
            const lessonSelect = document.getElementById("quiz-lesson-select")
            const startQuizBtn = document.getElementById("start-quiz-btn")
            const submitQuizBtn = document.getElementById("submit-quiz-btn")
            const quizQuestions = document.getElementById("quiz-questions")
            const quizResult = document.getElementById("quiz-result")
            const retakeQuizBtn = document.getElementById("retake-quiz-btn")

            // Load lessons for selection
            async function loadLessons() {
                try {
                    const lessons = await getLessons()
                    lessons.forEach((lesson) => {
                        const option = document.createElement("option")
                        option.value = lesson.id
                        option.textContent = lesson.title
                        lessonSelect.appendChild(option)
                    })
                    // Pre-select lesson if provided in URL
                    const urlParams = new URLSearchParams(window.location.search)
                    const lessonId = urlParams.get("lessonId")
                    if (lessonId) {
                        lessonSelect.value = lessonId
                    }
                } catch (error) {
                    showError(error.message)
                }
            }

            // Start quiz
            startQuizBtn.addEventListener("click", () => {
                const selectedLesson = lessonSelect.value
                if (!selectedLesson) {
                    showError("Please select a lesson first")
                    return
                }

                // Show quiz questions
                quizQuestions.style.display = "block"
                startQuizBtn.style.display = "none"
                submitQuizBtn.style.display = "inline-block"
                quizResult.style.display = "none"
            })

            // Submit quiz
            quizForm.addEventListener("submit", async (e) => {
                e.preventDefault()

                const selectedLesson = lessonSelect.value
                const formData = new FormData(quizForm)

                // Collect answers
                const answers = []

                const q1Answer = formData.get("q1")
                const q2Answer = formData.get("q2")

                if (q1Answer) answers.push({ questionId: 1, answer: q1Answer })
                if (q2Answer) answers.push({ questionId: 2, answer: q2Answer })

                if (answers.length === 0) {
                    showError("Please answer at least one question")
                    return
                }

                try {
                    const result = await submitQuiz(Number.parseInt(selectedLesson), answers)
                    displayQuizResult(result)
                } catch (error) {
                    showError(error.message)
                }
            })

            // Display quiz result
            function displayQuizResult(result) {
                const score = result.score
                const total = result.total
                const percentage = Math.round((score / total) * 100)

                document.getElementById("quiz-score").textContent = score
                document.getElementById("quiz-total").textContent = total
                document.getElementById("score-percentage").textContent = `${percentage}% Correct`

                // Display corrections with improved styling
                const correctionsList = document.getElementById("corrections-list")
                correctionsList.innerHTML = ""

                if (result.corrections && result.corrections.length > 0) {
                    result.corrections.forEach((correction) => {
                        const correctionElement = document.createElement("div")
                        const isCorrect = correction.correct

                        correctionElement.className = `card ${isCorrect ? 'bg-success' : 'bg-error'} text-white shadow`
                        correctionElement.innerHTML = `
                            <div class="card-body p-4">
                                <div class="flex items-start justify-between">
                                    <h4 class="card-title text-lg">
                                        Question ${correction.questionId}
                                        <span class="text-2xl ml-2">${isCorrect ? '✅' : '❌'}</span>
                                    </h4>
                                    <div class="badge ${isCorrect ? 'badge-success' : 'badge-error'} badge-lg">
                                        ${isCorrect ? 'Correct' : 'Incorrect'}
                                    </div>
                                </div>
                                <div class="mt-4 space-y-2">
                                    <p><strong>Your answer:</strong> ${correction.yourAnswer}</p>
                                    <p><strong>Correct answer:</strong> ${correction.correctAnswer}</p>
                                    ${!isCorrect ? `<p class="text-sm opacity-90"><strong>Tip:</strong> Review this topic in the lesson materials</p>` : ''}
                                </div>
                            </div>
                        `
                        correctionsList.appendChild(correctionElement)
                    })
                }

                // Hide quiz form and show result
                document.getElementById("quiz-questions").style.display = "none"
                document.getElementById("submit-quiz-btn").style.display = "none"
                document.getElementById("quiz-result").style.display = "block"

                // Scroll to results
                document.getElementById("quiz-result").scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                })
            }

            function showError(message) {
                const errorElement = document.getElementById("error-message")
                const errorText = document.getElementById("error-text")
                errorText.textContent = message
                errorElement.style.display = "block"
                setTimeout(() => {
                    errorElement.style.display = "none"
                }, 5000)
            }

            // Retake quiz
            retakeQuizBtn.addEventListener("click", () => {
                // Reset form
                quizForm.reset()

                // Reset UI state
                quizQuestions.style.display = "none"
                startQuizBtn.style.display = "inline-block"
                submitQuizBtn.style.display = "none"
                quizResult.style.display = "none"
            })

            // Load lessons on page load
            loadLessons()
        })
    </script>
</body>

</html>
