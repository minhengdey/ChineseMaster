<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson Detail - Bucha</title>
    <link rel="stylesheet" href="style/main.css">

</head>

<body>
    <nav class="bg-base-100 border-b">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="lessons.html" class="btn btn-ghost btn-sm">← Back</a>
                    <a href="index.html" class="font-bold">Bucha</a>
                </div>
                <div class="flex items-center gap-3">
                    <a href="lessons.html" class="btn btn-ghost btn-sm">Lessons</a>
                    <a href="flashcards.html" class="btn btn-ghost btn-sm">Flashcards</a>
                    <a href="pronunciation.html" class="btn btn-ghost btn-sm">Pronunciation</a>
                    <a href="quiz.html" class="btn btn-ghost btn-sm">Quiz</a>
                    <a href="profile.html" class="btn btn-ghost btn-sm">Profile</a>
                    <button id="logout-btn" class="btn btn-outline btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="min-h-screen bg-base-200">
        <div class="container mx-auto px-4 py-8">
            <main id="lesson-content">
                <!-- Lesson content will be loaded here -->
                <div class="text-center py-12">
                    <div class="loading loading-spinner loading-lg text-primary"></div>
                    <p class="mt-4 text-lg">Loading lesson content...</p>
                </div>
            </main>
        </div>

        <!-- Error Toast -->
        <div id="error-message" class="toast toast-top toast-end" style="display: none;">
            <div class="alert alert-error">
                <span id="error-text"></span>
            </div>
        </div>
    </div>

    <script type="module">
        import { requireAuth, getLessonDetail, getAudioUrl, showError, initGlobal } from './js/api.js'

        // wire global handlers (logout etc.)
        initGlobal()

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return

            const lessonContent = document.getElementById('lesson-content')
            const urlParams = new URLSearchParams(window.location.search)
            const lessonId = urlParams.get('id')

            if (!lessonId) {
                showError('Lesson ID not provided')
                return
            }

            async function loadLessonDetail() {
                try {
                    const lesson = await getLessonDetail(lessonId)
                    renderLessonDetail(lesson)
                } catch (err) {
                    showError(err.message || err)
                }
            }

            function renderLessonDetail(lesson) {
                const levelColors = {
                    'HSK1': 'badge-success',
                    'HSK2': 'badge-info',
                    'HSK3': 'badge-warning',
                    'HSK4': 'badge-error',
                    'HSK5': 'badge-secondary',
                    'HSK6': 'badge-accent'
                }

                let html = `
                    <!-- Hero Section -->
                    <div class="hero bg-gradient-to-r from-primary to-secondary text-primary-content rounded-xl mb-8">
                        <div class="hero-content text-center py-12">
                            <div class="max-w-2xl">
                                <div class="badge ${levelColors[lesson.level] || 'badge-neutral'} badge-lg mb-4">${lesson.level}</div>
                                <h1 class="text-4xl font-bold mb-4">${lesson.title}</h1>
                                <p class="text-lg opacity-90">${lesson.description || 'Master this lesson to improve your Chinese skills'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Lesson Content -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                        <div class="lg:col-span-2">
                            <div class="card bg-base-100 shadow-xl">
                                <div class="card-body">
                                    <h2 class="card-title text-2xl mb-4">
                                        <span class="mr-2">📖</span>
                                        Lesson Content
                                    </h2>
                                    <div class="prose max-w-none">
                                        <p class="text-lg leading-relaxed">${lesson.content}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <!-- Quick Stats -->
                            <div class="card bg-base-100 shadow-xl">
                                <div class="card-body">
                                    <h3 class="card-title text-lg mb-4">Lesson Stats</h3>
                                    <div class="space-y-3">
                                        <div class="flex justify-between">
                                            <span class="flex items-center gap-2">
                                                <span>📚</span>
                                                Words
                                            </span>
                                            <span class="font-bold">${lesson.wordCount || '20+'}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="flex items-center gap-2">
                                                <span>⏱️</span>
                                                Duration
                                            </span>
                                            <span class="font-bold">${lesson.duration || '15'} min</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="flex items-center gap-2">
                                                <span>🎯</span>
                                                Difficulty
                                            </span>
                                            <span class="font-bold">${lesson.level}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Quick Actions -->
                            <div class="card bg-base-100 shadow-xl">
                                <div class="card-body">
                                    <h3 class="card-title text-lg mb-4">Practice</h3>
                                    <div class="space-y-3">
                                        <a href="quiz.html?lessonId=${lesson.id}" class="btn btn-primary w-full">
                                            <span class="mr-2">📝</span>
                                            Take Quiz
                                        </a>
                                        <a href="pronunciation.html?lessonId=${lesson.id}" class="btn btn-secondary w-full">
                                            <span class="mr-2">🎤</span>
                                            Practice Pronunciation
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`

                // Audio files section
                if (lesson.audioFiles && lesson.audioFiles.length > 0) {
                    html += `
                    <div class="card bg-base-100 shadow-xl">
                        <div class="card-body">
                            <h2 class="card-title text-2xl mb-6">
                                <span class="mr-2">🔊</span>
                                Audio Pronunciation
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">`

                    lesson.audioFiles.forEach((audioFile) => {
                        const src = getAudioUrl(audioFile)
                        html += `
                            <div class="card bg-base-200 shadow">
                                <div class="card-body p-4">
                                    <h4 class="font-medium mb-3">${audioFile}</h4>
                                    <audio class="w-full" controls>
                                        <source src="${src}" type="audio/mpeg">
                                        Your browser does not support the audio element.
                                    </audio>
                                </div>
                            </div>`
                    })

                    html += `
                            </div>
                        </div>
                    </div>`
                }

                lessonContent.innerHTML = html
            }

            function showError(message) {
                const errorElement = document.getElementById("error-message")
                const errorText = document.getElementById("error-text")
                errorText.textContent = message
                errorElement.style.display = "block"
                setTimeout(() => {
                    errorElement.style.display = "none"
                }, 5000)
            }

            // initial load
            loadLessonDetail()
        })
    </script>
</body>

</html>
