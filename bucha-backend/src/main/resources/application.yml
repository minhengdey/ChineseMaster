spring:
   profiles:
      active: dev
   # Optional: set servlet.multipart.location (e.g. D:/temp) if system temp disk is full
   # Example: SPRING_SERVLET_MULTIPART_LOCATION=D:/temp
   datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
   jpa:
      hibernate:
         ddl-auto: update
      properties:
         hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.MySQL8Dialect
   h2:
      console:
         enabled: true

jwt:
   secret: ${JWT_SECRET}
   access-validity-ms: 900000
   refresh-validity-ms: 1209600000

cookie:
   secure: ${COOKIE_SECURE:false}
   domain: ${COOKIE_DOMAIN:localhost}
   same-site: ${COOKIE_SAME_SITE:Lax}

app:
   cors:
      allowed-origins: ${ALLOW_ORIGINS}
   data:
      initializer:
         enabled: ${DATA_INITIALIZER_ENABLED}
         source: CLOUDINARY
      admin:
         email: ${ADMIN_EMAIL:admin@chinesemaster.com}
         password: ${ADMIN_PASSWORD:ChangeMe123!}
         name: ${ADMIN_NAME:Administrator}
logging:
   level:
      root: ERROR
      com.bucha.service.CloudinaryService: DEBUG
      # org.springframework: DEBUG
      com.bucha: DEBUG

iflytek:
   app-id: ${APP_ID}
   api-key: ${API_KEY}
   api-secret: ${API_SECRET}
   host-url: wss://ise-api-sg.xf-yun.com/v2/ise
   # IAT (Short Form ASR) WebSocket for HSKK Part 2 — same APP_ID/API_KEY/API_SECRET as ISE
   iat-host: ${IFLYTEK_IAT_HOST:iat-api-sg.xf-yun.com}
   iat-path: ${IFLYTEK_IAT_PATH:/v2/iat}
   ent: cn_vip
   category: read_sentence
   # 16kHz, 16bit PCM per ISE docs; omit channel token
   auf: audio/L16;rate=16000
   # Raw PCM frames
   aue: raw
   sub: ise
   # Optional network settings for troubleshooting
   insecure-ssl: false
   disable-proxy: true
   proxy-host: ""
   proxy-port: 0
   # Advanced websocket tuning per ISE FAQ (approx 1280 bytes every 40ms)
   frame-size: 320
   frame-sleep-ms: 80
   connect-timeout-seconds: 15
   read-timeout-seconds: 300
   write-timeout-seconds: 120
   single-frame: false
   binary-frames: false

cloudinary:
   cloud-name: ${CLOUD_NAME}
   api-key: ${CLOUD_API_KEY}
   api-secret: ${CLOUD_API_SECRET}
   upload-folder: chinese-master

# Internal ISE score endpoint (used by SpeechEvaluationService for backend-to-backend call)
ise:
   score-url: ${ISE_SCORE_URL:https://chinese-master-be-f5emhxc7c5dwd7d2.southeastasia-01.azurewebsites.net/api/ise/score}

# Doubao AI for HSKK short feedback (optional; leave empty to use default text feedback)
doubao:
   api-url: ${DOUBAO_API_URL:https://api.doubao-ai.com/v1/chat/completions}
   api-key: ${DOUBAO_API_KEY:}
   model: ${DOUBAO_MODEL:doubao-pro-32k}
