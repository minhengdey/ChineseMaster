
services:
  bucha-be:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bucha-be
    environment:
      - DB_URL=jdbc:mysql://bucha-db:3306/buchadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=bucha
      - DB_PASSWORD=buchapass
    ports:
      - "8080:8080"
    depends_on:
      bucha-db:
        condition: service_healthy
  bucha-db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootroot
      - MYSQL_DATABASE=buchadb
      - MYSQL_USER=bucha
      - MYSQL_PASSWORD=buchapass
    ports:
      - "3306:3306"
    container_name: bucha-db
    volumes:
      - bucha-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  bucha-db-data:
