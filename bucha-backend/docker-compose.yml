version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: bucha
      MYSQL_USER: buchadb
      MYSQL_PASSWORD: buchapwd
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=ReplaceWithStrongSecret
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bucha?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=buchadb
      - SPRING_DATASOURCE_PASSWORD=buchapwd
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
